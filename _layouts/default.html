<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "zh-CN" }}">
<head>
  {%- include head.html -%}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/sidebar.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/layout.css' | relative_url }}">
  <link rel="manifest" href="{{ '/manifest.json' | relative_url }}">
</head>

<body class="layout-{{ page.layout }}">
  {%- include sidebar.html -%}
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- 自制星空背景（海蓝/天蓝渐变 + 闪烁星星 + 流星划过） -->
  <div class="starfield" id="starfield"></div>

  <main class="page-content" aria-label="Content">
    {{ content }}
  </main>

  <script>
    // 移动端侧边栏切换
    (function() {
      var toggle = document.getElementById('sidebar-toggle');
      var sidebar = document.getElementById('sidebar');
      var overlay = document.getElementById('sidebar-overlay');

      if (toggle) {
        toggle.addEventListener('click', function() {
          sidebar.classList.toggle('open');
          overlay.classList.toggle('active');
        });
      }

      if (overlay) {
        overlay.addEventListener('click', function() {
          sidebar.classList.remove('open');
          overlay.classList.remove('active');
        });
      }
    })();

    // 暗黑模式切换
    (function() {
      var saved = localStorage.getItem('dark-mode');
      if (saved === 'dark') {
        document.documentElement.classList.add('force-dark');
      }
    })();

    function toggleDarkSidebar() {
      var isDark = document.documentElement.classList.toggle('force-dark');
      localStorage.setItem('dark-mode', isDark ? 'dark' : 'light');
    }

    // 侧边栏搜索功能
    (function() {
      var searchData = null;
      var input = document.getElementById('sidebar-search-input');
      var results = document.getElementById('sidebar-search-results');
      var timer = null;

      function loadData() {
        if (searchData) return Promise.resolve(searchData);
        return fetch('{{ "/search.json" | relative_url }}')
          .then(function(r) { return r.json(); })
          .then(function(d) { searchData = d; return d; })
          .catch(function() { return []; });
      }

      function doSearch(keyword) {
        var kw = keyword.toLowerCase().trim();
        if (!kw || !searchData) {
          results.style.display = 'none';
          return;
        }
        var matched = searchData.filter(function(p) {
          var t = (p.title || '').toLowerCase();
          return t.indexOf(kw) !== -1;
        });
        if (!matched.length) {
          results.innerHTML = '<div class="no-results">未找到匹配内容</div>';
          results.style.display = 'block';
          return;
        }
        results.innerHTML = matched.slice(0, 8).map(function(p) {
          return '<a href="' + p.url + '"><div class="search-title">' + p.title + '</div><div class="search-meta">' + (p.date || '') + '</div></a>';
        }).join('');
        results.style.display = 'block';
      }

      loadData();

      if (input) {
        input.addEventListener('input', function() {
          clearTimeout(timer);
          var kw = this.value;
          if (!kw.trim()) {
            results.style.display = 'none';
            return;
          }
          loadData().then(function() { doSearch(kw); });
        });

        input.addEventListener('focus', function() {
          if (this.value.trim() && searchData) doSearch(this.value);
        });
      }

      document.addEventListener('click', function(e) {
        if (!e.target.closest('.sidebar-search')) {
          if (results) results.style.display = 'none';
        }
      });
    })();

    // 星空背景：生成星星 + 流星划过
    (function() {
      var field = document.getElementById('starfield');
      if (!field) return;

      // 生成闪烁的星星（150 颗，随机大小、位置、闪烁节奏）
      var starCount = 150;
      for (var i = 0; i < starCount; i++) {
        var star = document.createElement('div');
        star.className = 'star';
        var size = Math.random() * 2 + 1;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 2 + 's';
        star.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
        field.appendChild(star);
      }

      // 流星划过（每 3.5~6 秒随机出现一颗）
      function spawnMeteor() {
        var meteor = document.createElement('div');
        meteor.className = 'meteor';
        meteor.style.left = (Math.random() * 55 + 15) + '%';
        meteor.style.top = (Math.random() * 25 + 5) + '%';
        field.appendChild(meteor);
        setTimeout(function() {
          if (meteor.parentNode) meteor.parentNode.removeChild(meteor);
        }, 1500);
      }

      function scheduleMeteor() {
        var delay = Math.random() * 2500 + 3500; // 3.5s ~ 6s
        setTimeout(function() {
          spawnMeteor();
          scheduleMeteor();
        }, delay);
      }

      // 首次稍后出现一颗，然后循环
      setTimeout(spawnMeteor, 1200);
      scheduleMeteor();
    })();
  </script>

  {% if page.math %}
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        autoNumber: "AMS"
      },
      svg: {
        fontCache: "global"
      },
      startup: {
        pageReady: function() {
          return MathJax.startup.defaultPageReady().then(function() {
            document.querySelectorAll('.MathJax').forEach(function(el) {
              el.style.opacity = 1;
            });
          });
        }
      }
    };
  </script>
  {% endif %}
  <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

  <script>
    // 注册 Service Worker（仅生产环境）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('{{ "/sw.js" | relative_url }}')
          .catch(function(err) {
            console.log('Service Worker 注册失败:', err);
          });
      });
    }
  </script>
</body>
</html>
