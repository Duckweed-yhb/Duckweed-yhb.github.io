<aside class="site-sidebar" id="sidebar">
  <!-- Logo 区域 -->
  <div class="sidebar-header">
    <button type="button" class="sidebar-close" id="sidebar-close" aria-label="收起菜单" title="收起菜单">✕</button>
    <a class="sidebar-logo" href="{{ '/' | relative_url }}">星隅</a>
    <p class="sidebar-tagline">Duckweed 的个人博客</p>
  </div>

  <!-- 搜索区域 -->
  <div class="sidebar-search">
    <input type="text" id="sidebar-search-input" placeholder="在星云中寻找..." autocomplete="off">
    <div id="sidebar-search-results" style="display:none;"></div>
  </div>

  <!-- 导航区域 -->
  <nav class="sidebar-nav">
    {% for nav_item in site.data.navigation %}
    <a href="{{ nav_item.url | relative_url }}" class="sidebar-link {% if page.url == nav_item.url %}active{% endif %}">
      {{ nav_item.title }}
    </a>
    {% endfor %}
  </nav>

  <!-- 一句诗词点缀 -->
  <div class="sidebar-verse">
    <p class="verse-line">长风破浪会有时</p>
    <p class="verse-line">直挂云帆济沧海</p>
    <p class="verse-author">—— 李白《行路难》</p>
  </div>

  <!-- 底部工具 -->
  <div class="sidebar-footer">
    <div class="lang-switch">
      {% if page.url contains '/en/' %}
        <a href="{{ '/' | relative_url }}" class="lang-btn">中文</a>
        <span class="lang-btn active">EN</span>
      {% else %}
        <span class="lang-btn active">中文</span>
        <a href="{{ '/en/' | relative_url }}" class="lang-btn">EN</a>
      {% endif %}
    </div>
    <button id="dark-toggle-sidebar" onclick="toggleDarkSidebar()" title="切换明暗主题" aria-label="切换明暗主题">🌓</button>
  </div>

  <!-- Bloom 色板选择（十套莫兰迪 OKLCH 色板，色点由 default.html 注入） -->
  <div class="sidebar-palette">
    <button type="button" class="palette-toggle" id="palette-toggle" title="切换色板" aria-label="切换色板">🎨 <span class="palette-name">色板</span></button>
    <div class="palette-dots" id="palette-dots" hidden></div>
  </div>
</aside>

<!-- 移动端菜单按钮 -->
<button class="sidebar-toggle" id="sidebar-toggle" aria-label="菜单">☰</button>
