<!-- _includes/head.html - 页面头部核心组件 -->
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1">
<!-- 视口设置：禁止缩放+适配刘海屏/全面屏 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- 图标配置 -->
<link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}" sizes="64x64">

<!-- 性能优化：预连接第三方资源 -->
<link rel="preconnect" href="https://cdn.bootcdn.net">
<link rel="preconnect" href="https://cdn.jsdelivr.net">

<!-- 原有核心SEO功能 -->
{%- seo -%}

<!-- 样式加载优化 -->
<!-- main.css、sidebar.css 和 layout.css 已在 default.html 中按顺序加载，星空背景样式位于 layout.css -->

<!-- 引入Font Awesome图标库 -->
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- RSS订阅 -->
{%- feed_meta -%}

<!-- 谷歌分析（仅在配置了google_analytics时加载） -->
{%- if jekyll.environment == 'production' and site.google_analytics -%}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
{%- endif -%}
